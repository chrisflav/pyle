name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Headers only: the library itself is the static one the Lean toolchain ships.
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - uses: leanprover/lean-action@v1
        with:
          test: true

      # The built `pyle` against real HTTP: scripts/integration.sh drives it
      # with curl and a standard-library Python client.
      - name: Integration test
        run: ./scripts/integration.sh