name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: the build and every dependency it fetches hold no token that can
# write.  Actions are pinned by commit.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Headers only: the library itself is the static one the Lean toolchain ships.
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          test: true

      # The built `pyle` against real HTTP: scripts/integration.sh drives it
      # with curl and a standard-library Python client.
      - name: Integration test
        run: ./scripts/integration.sh