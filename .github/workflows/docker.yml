name: Docker image

# Builds the runtime image on every change, and publishes it to
# ghcr.io/chrisflav/pyle when the change is on master or tagged.  Pull requests
# build but do not push: the point there is to catch a broken Dockerfile on the
# pull request that caused it rather than on master afterwards, and a fork's
# token cannot push to the registry in any case.

on:
  # Only the default branch on push.  A push to any other branch that has an
  # open pull request would otherwise build twice, once for the push and once
  # for the pull request, for the same commits.
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Superseded runs are worth nothing and this build is long.
concurrency:
  group: docker-${{ github.ref }}
  # Only for pull requests.  On master each commit's image is what a
  # deployment pins by its sha, so a run cancelled by the next push would leave
  # a commit with none.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest

    env:
      # Every step that differs between "validate this change" and "ship this
      # change" keys off this.
      publish: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v5

      # buildx, for the layer cache below and for docker/Dockerfile.dockerignore;
      # the classic builder reads neither.
      - uses: docker/setup-buildx-action@v3

      - if: env.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Not a configured secret: GitHub mints this per run, and
          # `packages: write` above is what makes it able to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pyle
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            # The bare 40-character commit sha, so the tag is exactly what
            # `git rev-parse HEAD` prints and a deployment can pin a revision.
            type=sha,format=long,prefix=

      - id: build
        uses: docker/build-push-action@v6
        with:
          # The repository root: every COPY in the Dockerfile is relative to it.
          context: .
          file: docker/Dockerfile
          push: ${{ env.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A pull request reads master's cache, so a change that leaves the
          # Lean sources alone reuses the whole build stage.  Written on master
          # only: mode=max entries are large, and one per pull request would
          # evict the master entry they all read from.
          cache-from: type=gha,scope=pyle
          cache-to: ${{ env.publish == 'true' && 'type=gha,mode=max,scope=pyle' || '' }}

      - name: Summarise
        if: env.publish == 'true'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/pyle:${{ github.sha }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"